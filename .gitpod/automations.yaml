services:
  elite-finds-bot:
    name: Elite Finds Bot
    description: Discord bot - Elite Finds#3377
    commands:
      start: cd /workspaces/elite-finds && python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt && .venv/bin/python -m bot.main
      ready: pgrep -f "bot.main" > /dev/null
