[supervisord]
nodaemon=true
logfile=/workspaces/elite-finds/supervisord.log
pidfile=/workspaces/elite-finds/supervisord.pid
loglevel=info

[program:elite-finds-bot]
command=/home/codespace/.python/current/bin/python3 -m bot.main
directory=/workspaces/elite-finds
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/workspaces/elite-finds/bot.log
stderr_logfile=/workspaces/elite-finds/bot.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true
environment=HOME="/home/codespace",PATH="/usr/local/bin:/usr/bin:/bin"
